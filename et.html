<script>
function bPiano(){
    var c=document.getElementById('piano-container'); if(!c)return;
    c.innerHTML=''; keys=[];
    var wC=0;
    // 🎯 RESTORED: Standard piano black key semitone steps array
    var bl=[1, 3, 6, 8, 10];
    var whiteKeysTemp=[];
    var blackKeysTemp=[];
    var totalWhiteKeys = 22;
    var keyWidthPercent = 100 / totalWhiteKeys;

    for(var i=0; i<37; i++){
        var nI=i%12;
        if(bl.indexOf(nI)===-1){
            var k=document.createElement('div'); k.className='key white'; k.dataset.idx=i;
            k.style.width = keyWidthPercent + "%";

            if(i===0) k.innerText='C3';
            if(i===12) k.innerText='C4';
            if(i===24) k.innerText='C5';
            if(i===36) k.innerText='C6';

            for(var s=2; s>=0; s--){var d=document.createElement('div'); d.className='dot dot-'+s; k.appendChild(d)}
            keys.push({el:k, f:130.81*Math.pow(2,i/12), nI:nI, absIdx:i});
            whiteKeysTemp.push(k);
            wC++;

            var nextAbs=i+1;
            var nextNI=nextAbs%12;
            if(bl.indexOf(nextNI)!==-1 && nextAbs<37){
                var b=document.createElement('div'); b.className='key black'; b.dataset.idx=nextAbs;
                b.style.width = (keyWidthPercent * 0.65) + "%";
                b.style.left = (wC * keyWidthPercent) + "%";
                for(var s2=2; s2>=0; s2--){var d2=document.createElement('div'); d2.className='dot dot-'+s2; b.appendChild(d2)}
                keys.push({el:b, f:130.81*Math.pow(2,nextAbs/12), nI:nextNI, absIdx:nextAbs});
                blackKeysTemp.push(b);
            }
            if(wC >= totalWhiteKeys) break;
        }
    }
    whiteKeysTemp.forEach(function(wk){ c.appendChild(wk); });
    blackKeysTemp.forEach(function(bk){ c.appendChild(bk); });
}

function pN(f, d, volMultiplier, delayTime){
    if(!volMultiplier) volMultiplier = 1.0;
    if(!delayTime) delayTime = 0;

    if(!ctx){
        ctx=new(window.AudioContext||window.webkitAudioContext)();
        gain=ctx.createGain(); gain.connect(ctx.destination);
    }
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type="triangle";

    var startTime = ctx.currentTime + delayTime;
    o.frequency.setValueAtTime(f, startTime);

    g.gain.setValueAtTime(0, startTime);
    g.gain.linearRampToValueAtTime(0.12 * volMultiplier, startTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.01, startTime + d);
    o.connect(g); g.connect(gain);
    o.start(startTime); o.stop(startTime + d);
}

    return chromaticReferenceNotes.indexOf(raw);
}

<script>
function parseInterval(symbol) {
    var mod = 'N', degStr = symbol;
    if (symbol.charAt(0) === 'b') { mod = 'b'; degStr = symbol.substring(1); }
    else if (symbol.charAt(0) === '#') { mod = '#'; degStr = symbol.substring(1); }

    var deg = parseInt(degStr, 10);
    if (deg === 9) deg = 2;
    if (deg === 11) deg = 4;
    if (deg === 13) deg = 6;

    return { deg: deg, mod: mod };
}

function getScaleNoteSafe(scaleArray, degree) {
    if (!scaleArray) return "C";
    if (degree < scaleArray.length) return scaleArray[degree];
    var adjustedDegree = ((degree - 1) % 7) + 1;
    return scaleArray[adjustedDegree];
}

function getN(rName, id, cat) {
    var sc = scaleTable[rName];
    var intervals = chordModTable[id] || ['1', '3', '5'];
    var finalNotes = [];
    for (var i = 0; i < intervals.length; i++) {
        var item = parseInterval(intervals[i]);
        var baseNote = getScaleNoteSafe(sc, item.deg);
        finalNotes.push((alterationTable[item.mod] && alterationTable[item.mod][baseNote]) ? alterationTable[item.mod][baseNote] : baseNote);
    }
    return { n: finalNotes, suf: "" };
}

<script>
function playSequenceChallenge(chordNotes, targetNoteName, gradeLabel) {
    if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        gain = ctx.createGain(); gain.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();

    var absoluteRootIdx = 0;
    if (chordNotes && chordNotes.length > 0) {
        var chordRootPClass = getMidiIdx(chordNotes[0]) % 12;
        for (var m = 0; m < keys.length; m++) {
            if (keys[m].nI === chordRootPClass && keys[m].absIdx >= 0 && keys[m].absIdx <= 12) {
                absoluteRootIdx = keys[m].absIdx;
                break;
            }
        }
    }

    // 1. Play all reference chord notes instantly (with duplicated root 1 octave below)
    for (var j = 0; j < chordNotes.length; j++) {
        var chordPClass = getMidiIdx(chordNotes[j]) % 12;
        for (var m = 0; m < keys.length; m++) {
            if (keys[m].nI === chordPClass && keys[m].absIdx >= 0 && keys[m].absIdx <= 12) {
                var dynamicVolume = (j === 0) ? 2.5 : 1.2;
                pN(keys[m].f, 1.6, dynamicVolume, 0);

                // 🎯 DUPLICATE ROOT ONLY HERE: One octave below inside the chord context
                if (j === 0) {
                    var subOctaveAbsIdx = keys[m].absIdx - 12;
                    for (var bIdx = 0; bIdx < keys.length; bIdx++) {
                        if (keys[bIdx].absIdx === subOctaveAbsIdx) {
                            pN(keys[bIdx].f, 1.6, 2.5, 0);
                            break;
                        }
                    }
                }
                break;
            }
        }
    }

    // 2. Locate target mystery key bounds
    var targetPClass = getMidiIdx(targetNoteName) % 12;
    var targetKeyFound = null;
    var isExtensionOctave = (gradeLabel === "8" || gradeLabel === "b9" || gradeLabel === "9" || gradeLabel === "#9" || gradeLabel === "11" || gradeLabel === "#11" || gradeLabel === "b13" || gradeLabel === "13");

    for (var m = 0; m < keys.length; m++) {
        if (keys[m].nI === targetPClass) {
            if (isExtensionOctave) {
                if (keys[m].absIdx >= (absoluteRootIdx + 12) && keys[m].absIdx <= (absoluteRootIdx + 24)) {
                    targetKeyFound = keys[m];
                    break;
                }
            } else {
                if (keys[m].absIdx >= absoluteRootIdx && keys[m].absIdx <= (absoluteRootIdx + 12)) {
                    targetKeyFound = keys[m];
                    break;
                }
            }
        }
    }

    if (!targetKeyFound) {
        for (var m = 0; m < keys.length; m++) {
            if (keys[m].nI === targetPClass && keys[m].absIdx >= absoluteRootIdx && keys[m].absIdx <= (absoluteRootIdx + 24)) {
                targetKeyFound = keys[m];
                break;
            }
        }
    }

    // 3. Play isolated mystery note 1.8 seconds later (STRICTLY SINGLE NOTE Pitch)
    if (targetKeyFound) {
        pN(targetKeyFound.f, 1.5, 2.0, 1.8);
        if (chal && chal.s) { chal.s.correctAbsIdx = targetKeyFound.absIdx; }
    }
}
</script>

            document.getElementById('root-cb').checked = s.r; document.getElementById('play-cb').checked = s.p; document.getElementById('auto-cb').checked = s.a;
            selH = s.h || {}; if(s.g) selectedTargetGrades = s.g;

function uType(cat){

    if (!selH[cat] || selH[cat].length === 0) { selH[cat] = itemsList.map(function(item) { return item.id; }); }

    itemsList.forEach(function(t){
        var b = document.createElement('button'); var isA = (selH[cat].indexOf(t.id) !== -1);
        b.className = 'type-toggle' + (isA ? ' active' : ''); b.dataset.id = t.id; b.innerText = t.l;

<script>
window.addEventListener('DOMContentLoaded', function() {
    var chordDefs = document.querySelectorAll('.chord-def');
    for(var cIdx=0; cIdx<chordDefs.length; cIdx++) {
        var cGrid = chordDefs[cIdx]; var cat = cGrid.getAttribute('data-cat'); var cid = cGrid.getAttribute('data-id');
        cfg[cat].push({ id: cid, l: cGrid.getAttribute('data-label') });
    }

    bPiano(); loadS(); tUI(); buildGradeSelectorInterface(); buildTonalityRootSelectorInterface();

    var pianoContainer = document.getElementById('piano-container');

        pianoContainer.onpointerdown = function(e){
            var el = e.target.closest('.key'); if(!el || !chal) return;

            var allKeys = pianoContainer.querySelectorAll('.key');
            for (var i = 0; i < allKeys.length; i++) allKeys[i].classList.remove('step-0');

            var kO = null;
            for(var i = 0; i < keys.length; i++){ if(keys[i].el === el){ kO = keys[i]; break; } }
            if(!kO) return;

            el.classList.add('step-0');
//            playO = [i18n[curL].nB[kO.nI] + " (Idx " + kO.absIdx + ")"];
            playO = [i18n[curL].nB[kO.nI]];
            uDeb();

            var sD = chal.s;
            var userSelectedAbsIdx = kO.absIdx;
            var targetText = document.getElementById('target-text');
            var targetCorrectAbsIdx = parseInt(sD.correctAbsIdx, 10);

            if(userSelectedAbsIdx === targetCorrectAbsIdx) {
                if (targetText) {
                    targetText.style.color = "#0fc";
                    targetText.innerText = "CORRECT! Note: " + sD.targetNote;
                }
                pN(kO.f, 1.0, 0);

                if(document.getElementById('auto-cb').checked) {
                    setTimeout(function(){
                        var nB = document.getElementById('btn-new');
                        if (nB) nB.click();
                    }, 2000);
                }
            } else {
                pN(kO.f, 0.8, 0);
                if (targetText) {
                    targetText.style.color = "#f44";
                    if (!isNaN(targetCorrectAbsIdx) && (userSelectedAbsIdx % 12) === (targetCorrectAbsIdx % 12)) {
                        targetText.innerText = "Correct note, wrong octave! Check your Extensions vs Degrees.";
                    } else {
                        targetText.innerText = "Incorrect Pitch! Retry.";
                    }
                }
            }
        };
    }

    document.getElementById('btn-new').onclick = function() {
        var aC = document.querySelector('.cat-toggle.active'); if(!aC) return; curCat = aC.dataset.cat;
        var allowedChords = selH[curCat] || []; if(!allowedChords.length) return;

        var ks = document.querySelectorAll('.key');
        for(var i = 0; i < ks.length; i++){
            ks[i].className = ks[i].className.split(' ').filter(function(x){ return ['key','white','black'].indexOf(x) !== -1; }).join(' ');
        }

        var homeKey = "", chosenChordId = "", chordData = null;
        var randomGradeLabel = "", parsedInterval = null;
        var chosenHomeRootKey = "", scaleNotes = null;
        var baseNote = "", targetMysteryNote = "";

        var maxHistoryLength = Math.min(3, Math.max(0, selectedTargetGrades.length - 1));
        var attempts = 0, maxAttempts = 100;

        while(attempts < maxAttempts) {
            homeKey = selectedActiveRoots[Math.floor(Math.random() * selectedActiveRoots.length)];
            chosenChordId = allowedChords[Math.floor(Math.random() * allowedChords.length)];
            chordData = getN(homeKey, chosenChordId, curCat);

            randomGradeLabel = selectedTargetGrades[Math.floor(Math.random() * selectedTargetGrades.length)];
            parsedInterval = parseInterval(gradeIntervalMap[randomGradeLabel]);

            chosenHomeRootKey = homeKey;
            if (!scaleTable[homeKey]) { chosenHomeRootKey = "C"; }
            scaleNotes = scaleTable[chosenHomeRootKey];

            baseNote = getScaleNoteSafe(scaleNotes, parsedInterval.deg);
            targetMysteryNote = baseNote;
            if (alterationTable[parsedInterval.mod] && alterationTable[parsedInterval.mod][baseNote]) {
                targetMysteryNote = alterationTable[parsedInterval.mod][baseNote];
            }

            if (targetNoteHistoryQueue.indexOf(targetMysteryNote) === -1 || maxHistoryLength === 0 || attempts > 80) {
                targetNoteHistoryQueue.push(targetMysteryNote);
                while (targetNoteHistoryQueue.length > maxHistoryLength) {
                    targetNoteHistoryQueue.shift();
                }
                break;
            }
            attempts++;
        }

        var fullChordTitle = homeKey + " " + chosenChordId;
        chal = { s: { dT: "? Note context: " + fullChordTitle, dN: fullChordTitle + " -> Grade: " + randomGradeLabel, chordNotes: chordData.n, targetNote: targetMysteryNote, gLabel: randomGradeLabel }, t: 1 };

        var tE = document.getElementById('target-text'); if(tE) { tE.innerText = chal.s.dT; tE.style.color = "#0fc"; }
        uDeb();
        if(document.getElementById('play-cb').checked) { playSequenceChallenge(chal.s.chordNotes, chal.s.targetNote, randomGradeLabel); }
    };

    document.getElementById('btn-replay').onclick = function() {
        if (chal && chal.s && chal.s.chordNotes && chal.s.targetNote) {
            playSequenceChallenge(chal.s.chordNotes, chal.s.targetNote, chal.s.gLabel);
        }
    };

    document.getElementById('lang-select').onchange = function(e){ curL = e.target.value; tUI(); saveS(); document.getElementById('btn-new').click(); };
    document.getElementById('root-cb').onchange = saveS; document.getElementById('play-cb').onchange = saveS; document.getElementById('auto-cb').onchange = saveS;
    document.getElementById('target-text').onclick = function() { deb = !deb; uDeb(); };
    document.getElementById('btn-reset').onclick = function() { targetNoteHistoryQueue = []; localStorage.removeItem('chordProCfg'); location.reload(); };

    var catsBtns = document.querySelectorAll('.cat-toggle');
    for(var i = 0; i < catsBtns.length; i++){
        catsBtns[i].onclick = function(){
            for(var j = 0; j < catsBtns.length; j++) catsBtns[j].classList.remove('active');
            this.classList.add('active');
            uType(this.dataset.cat);
            saveS();
            document.getElementById('btn-new').click();
        };
    }

    var startingCat = curCat || 'triad';
    for (var j = 0; j < catsBtns.length; j++) {
        if (catsBtns[j].dataset.cat === startingCat) {
            catsBtns[j].classList.add('active');
        } else {
            catsBtns[j].classList.remove('active');
        }
    }
    uType(startingCat);
});
</script>
